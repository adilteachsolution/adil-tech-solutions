<section class="quote-page">


<h1>
Request Your Project Quote
</h1>


<p>
Tell us about your business and project requirements.
</p>



<form class="quote-form">


<label>
Full Name
</label>

<input type="text"
placeholder="Enter your name"
required>



<label>
Country
</label>

<input type="text"
placeholder="Enter your country"
required>




<label>
Email
</label>

<input type="email"
placeholder="Enter your email"
required>




<label>
WhatsApp Number
</label>

<input type="tel"
placeholder="Enter WhatsApp number"
required>




<label>
Business Name
</label>

<input type="text"
placeholder="Business name">




<label>
Business Type
</label>


<select>

<option>
Select Business Type
</option>

<option>
Restaurant
</option>

<option>
Hotel
</option>

<option>
Clinic
</option>

<option>
Shop
</option>

<option>
Other
</option>


</select>





<label>
Required Service
</label>


<select>

<option>
Select Service
</option>

<option>
Website Development
</option>

<option>
Software Development
</option>

<option>
Mobile App Development
</option>

<option>
Digital Marketing
</option>


</select>






<label>
Project Description
</label>


<textarea rows="6"
placeholder="Describe your project">
</textarea>





<label>
Budget Range
</label>


<select>

<option>
Select Budget
</option>

<option>
Basic
</option>

<option>
Standard
</option>

<option>
Advanced
</option>

<option>
Custom
</option>


</select>

Submit Request
</button>
